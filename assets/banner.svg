<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" role="img" aria-labelledby="title desc">
  <title id="title">Neya — the fitting room, everywhere</title>
  <desc id="desc">An illustration of shopping with Neya: a clothing photo is selected in a store window and sent to a live mirror. Dark olive, warm white, and lime green.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d7fa87" stroke-opacity=".045"/></pattern>
    <linearGradient id="room" x2="0" y2="1"><stop stop-color="#dddcc9"/><stop offset="1" stop-color="#afb69b"/></linearGradient>
  </defs>
  <rect width="1280" height="580" rx="24" fill="#151a14"/>
  <rect width="1280" height="580" rx="24" fill="url(#grid)"/>
  <circle cx="1160" cy="100" r="240" fill="none" stroke="#d7fa87" stroke-opacity=".1"/>
  <circle cx="1160" cy="100" r="200" fill="none" stroke="#d7fa87" stroke-opacity=".07"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="58" y="64" fill="#d7fa87" font-size="13" font-weight="700" letter-spacing="3">THE FITTING ROOM, EVERYWHERE.</text>
    <text x="56" y="181" fill="#f4f5ed" font-size="76" font-weight="700" letter-spacing="-4">Find your</text>
    <text x="56" y="267" fill="#d7fa87" font-family="Georgia, serif" font-style="italic" font-size="84" letter-spacing="-3">next look.</text>
    <text x="60" y="322" fill="#b5bfaa" font-size="20">From a store photo to your live mirror.</text>
    <text x="60" y="352" fill="#b5bfaa" font-size="20">All from the browser you already use.</text>
    <rect x="58" y="395" width="174" height="48" rx="24" fill="#d7fa87"/>
    <text x="86" y="425" fill="#18230f" font-size="15" font-weight="700">SEE IT. WEAR IT.</text>
    <text x="60" y="516" fill="#78846f" font-size="12" letter-spacing="2">01 BROWSE</text>
    <path d="M166 512h34" stroke="#526047"/>
    <text x="217" y="516" fill="#78846f" font-size="12" letter-spacing="2">02 PICK</text>
    <path d="M295 512h34" stroke="#526047"/>
    <text x="346" y="516" fill="#d7fa87" font-size="12" letter-spacing="2">03 TRY ON</text>
    <rect x="632" y="95" width="336" height="368" rx="18" fill="#10150e" stroke="#5c6950"/>
    <path d="M650 135h298" stroke="#35412d"/>
    <circle cx="653" cy="116" r="3" fill="#6d785f"/><circle cx="665" cy="116" r="3" fill="#6d785f"/><circle cx="677" cy="116" r="3" fill="#6d785f"/>
    <text x="701" y="120" fill="#839075" font-size="10" letter-spacing="1">YOUR FAVORITE STORE</text>

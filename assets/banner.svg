    <circle cx="763" cy="244" r="2" fill="#d7fa87"/><circle cx="763" cy="266" r="2" fill="#d7fa87"/><circle cx="763" cy="288" r="2" fill="#d7fa87"/>
    <rect x="663" y="166" width="92" height="24" rx="12" fill="#d7fa87"/>
    <text x="676" y="182" fill="#18230f" font-size="10" font-weight="700">✓ SELECTED</text>
    <text x="654" y="414" fill="#f4f5ed" font-size="17" font-weight="700">The everyday layer</text>
    <text x="654" y="437" fill="#87947a" font-size="12">One photo. A whole new possibility.</text>
